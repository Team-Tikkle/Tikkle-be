# 운영 서버(4GB, 서버 1대)에서 앱과 Redis 를 띄운다. .env 는 배포 스크립트가 SSM 값으로 만든다.
services:
  redis:
    image: redis:7-alpine
    container_name: tikkle-redis
    # AOF 를 켠다. refresh_token 이 Redis 에 있어서, 영속화 없이 재시작하면 전 사용자가 로그아웃된다.
    # 메모리 상한을 넘으면 쓰기가 실패한다(noeviction) — 결제 멱등 키·토큰을 몰래 지우지 않게 한다.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    # 배포 스크립트가 .env 에 IMAGE_URI 를 써 넣는다 (ECR 이미지, 커밋 SHA 태그).
    image: ${IMAGE_URI}
    container_name: tikkle-be
    # 외부 노출은 nginx 가 담당한다. 루프백에만 바인딩해 보안 그룹이 잘못 열려도 직접 노출되지 않게 한다.
    # 8081(헬스체크)은 nginx 도 프록시하지 않는다 — 서버 안에서만 본다.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    env_file:
      - .env
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - TZ=Asia/Seoul
      # 힙은 컨테이너 메모리의 70%. 메모리가 바닥나면 멈춘 채 버티지 않고 종료해 다시 뜨게 한다
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    mem_limit: 2560m
    # 앱의 종료 단계 유예(40초)보다 길게. 기본값 10초면 진행 중인 승인·폴링이 강제로 끊긴다
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
