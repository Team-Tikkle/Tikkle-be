spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tikkle_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: "root"
    password: "1234"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  ai:
    # 결제 카테고리 분류용 (Gemini)
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: "gemini-2.5-flash"
          temperature: 0.0

    # 2. 신규: 3주 차 주식 추천 코어용 (DeepSeek)
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-pro
        max-tokens: 8192
        timeout: 7m

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

tikkle:
  payment:
    secret-key: ${PAYMENT_SECRET_KEY}
  encrypt:
    secret-key: ${TIKKLE_ENCRYPT_SECRET_KEY}
  fcm:
    # 로컬은 기본 비활성 — 키 없이 기동 가능. 발송을 검증하려면 아래 두 값을 채우고 enabled=true
    enabled: ${FCM_ENABLED:false}
    # 서비스 계정 키(JSON)를 base64로 인코딩한 문자열. 리포지토리에 원본 JSON을 두지 않는다.
    credentials-base64: ${FCM_CREDENTIALS_BASE64:}

app:
  cors:
    allowed-origins: http://localhost:5173,https://localhost

coolsms:
  api:
    key: ${COOLSMS_API_KEY}
    secret: ${COOLSMS_API_SECRET}
  sender-number: ${COOLSMS_SENDER_NUMBER}
