spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tikkle_db?useSSL=false&allowPublicKeyRetrieval=true
    username: "root"
    password: "1234"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true