name: Tikkle Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시될 때 작동

env:
  PROJECT_ID: "project-4c111968-8a40-4fc9-b55" # 본인의 GCP 프로젝트 ID
  REGION: "asia-northeast3"
  REPO_NAME: "tikkle-repo"
  IMAGE_NAME: "tikkle-be"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # WIF 인증을 위한 필수 권한 설정
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 1. 레포지토리 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. application-prod.yml 설정 파일 생성 (Secrets 주입)
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_PROD_YML }}" > src/main/resources/application-prod.yml

      - name: 3. Java 21 JDK 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. Gradle 빌드 (테스트는 스킵하여 배포 속도 향상 및 DB 에러 방지)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 5. GCP 인증 (WIF 활용 - Keyless Auth)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: 6. GCP Cloud SDK 설정
        uses: google-github-actions/setup-gcloud@v2

      - name: 7. Docker 인증 (Artifact Registry 접근)
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 8. Docker 이미지 빌드 및 푸시
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t $IMAGE_PATH .
          docker push $IMAGE_PATH

      - name: 9. GCP 서버 SSH 접속 후 배포 및 재실행
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest"
          
          gcloud compute ssh canach3@tikkle-server \
            --zone=${{ env.REGION }}-a \
            --project=${{ env.PROJECT_ID }} \
            --command="
              # 0) 도커 인증 갱신
              gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          
              cd /home/canach3/Tikkle-be &&
          
              # 1) 원격 저장소 동기화
              git fetch origin main &&
              git reset --hard origin/main &&
          
              # 2) .env 파일 재생성
              echo 'SPRING_PROFILES_ACTIVE=prod' > .env &&
              echo 'DB_URL=${{ secrets.DB_URL }}' >> .env &&
              echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env &&
              echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env &&
              echo 'REDIS_HOST=${{ secrets.REDIS_HOST }}' >> .env &&
          
              # 3) 컨테이너 업데이트 및 최적화 (수정된 부분)
              docker pull $IMAGE_PATH &&
              docker-compose down &&
              docker-compose up -d &&
              docker image prune -f
            "