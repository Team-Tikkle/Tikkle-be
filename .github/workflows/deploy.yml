name: Tikkle Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시될 때 작동

env:
  AWS_REGION: "ap-northeast-2"
  ECR_REPOSITORY: "tikkle-be"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # OIDC(키리스 인증)에 필요한 권한. 액세스 키를 Secrets 에 넣지 않는다.
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 1. 레포지토리 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. application-prod.yml 설정 파일 생성 (Secrets 주입)
        # 시크릿을 env 로 넘기고 printf 로 쓴다. run 블록에 직접 치환하면 yml 안의
        # ${DB_URL} 같은 Spring placeholder 를 러너의 bash 가 빈 값으로 확장해 버린다.
        env:
          APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
        run: |
          mkdir -p src/main/resources
          printf '%s\n' "$APPLICATION_PROD_YML" > src/main/resources/application-prod.yml

      - name: 3. Java 21 JDK 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. Gradle 빌드 (테스트는 스킵하여 배포 속도 향상 및 DB 에러 방지)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 5. AWS 인증 (OIDC - Keyless Auth)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 6. ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 7. Docker 이미지 빌드 및 푸시
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" -t "${REGISTRY}/${ECR_REPOSITORY}:latest" .
          docker push "$IMAGE_URI"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: 8. EC2 배포 (SSM Run Command)
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # 시크릿은 넘기지 않는다. 인스턴스가 Parameter Store 에서 직접 읽는다.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Tikkle deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "commands=[
              'set -e',
              'cd /home/ec2-user/Tikkle-be',
              'git fetch origin main',
              'git reset --hard origin/main',
              'chmod +x infra/deploy-remote.sh',
              'sudo -u ec2-user ./infra/deploy-remote.sh ${IMAGE_URI}'
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM CommandId: $COMMAND_ID"

          # 완료까지 대기 (aws ssm wait 는 최대 대기가 짧아 직접 폴링한다)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" --details \
              --query "CommandInvocations[0].Status" --output text)
            echo "  [$i] status=$STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "── 원격 실행 로그 ──"
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" --details \
            --query "CommandInvocations[0].CommandPlugins[0].Output" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::배포 실패 (status=$STATUS)"
            exit 1
          fi
