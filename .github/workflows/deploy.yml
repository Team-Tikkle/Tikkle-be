name: Tikkle Backend CI/CD Pipeline

# main 에 머지되면 운영 서버에 배포한다. 서버 1대라 배포 중 앱이 다시 뜨는 동안 잠깐 502 가 난다.
# 테스트는 PR 에서 이미 통과했다(main 보호의 필수 검사 "test"). 여기서는 다시 돌리지 않는다.
# 되돌리기는 rollback.yml(직전 이미지 태그를 손으로 고른다).
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "infra/terraform/**" # 인프라 코드만 바뀐 머지는 앱을 다시 배포하지 않는다

# 배포와 되돌리기가 겹치지 않게 한 번에 하나만 돈다. 진행 중인 배포는 취소하지 않는다
concurrency:
  group: production-deploy
  cancel-in-progress: false

# OIDC(키리스 인증)에 필요한 권한만. 액세스 키를 Secrets 에 넣지 않는다
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: tikkle-be

jobs:
  deploy:
    # 운영 서버가 arm64(t4g)라 arm64 러너에서 그대로 빌드한다
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40

    steps:
      # 액션은 커밋 SHA 로 고정한다(태그는 옮겨질 수 있다). 주석은 그 SHA 의 릴리스
      - name: 1. 코드 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 2. Java 21 (Gradle 캐시)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 3. jar 빌드
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bootJar

      - name: 4. AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # 공개 레포라 로그에 계정 ID 가 찍히지 않게 가린다(이미지 주소에도 들어 있다)
          mask-aws-account-id: true

      - name: 5. ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: 6. 이미지 빌드·푸시 (태그 = 커밋 SHA)
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: 7. 서버에 배포 (SSM)
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: bash .github/scripts/deploy-via-ssm.sh "$IMAGE_URI"
