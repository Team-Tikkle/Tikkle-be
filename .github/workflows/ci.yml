name: Tikkle Backend PR Test

on:
  pull_request:
    branches: [ "main" ] # main 으로 가는 PR 에서 테스트를 실행
  workflow_dispatch:

# 시크릿을 쓰지 않는다. 테스트는 application-test.yml 의 테스트용 값만 사용한다.
permissions:
  contents: 'read'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 레포지토리 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. Java 21 JDK 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. 테스트 실행 (MySQL·Redis 는 Testcontainers 가 러너의 Docker 로 띄운다)
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: 4. 실패 시 테스트 보고서 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests
          retention-days: 7
