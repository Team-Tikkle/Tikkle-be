# api.tikkle.xyz 리버스 프록시
#
# 앱 컨테이너는 127.0.0.1:8080 에만 바인딩되어 외부에서 직접 닿지 않는다.
# TLS 종단은 이 Nginx 가 담당한다 (certbot --nginx 가 443 블록을 자동 추가).
#
# ⚠️ SSE 주의: 결제 파이프라인의 진행 상황은
#    GET /api/payments/{eventId}/stream 이 SSE 로 흘려보낸다.
#    프록시 버퍼링이 켜져 있으면 이벤트가 버퍼에 갇혀 앱이 결과를 못 받는다.
#    아래 stream 전용 location 의 proxy_buffering off 를 절대 지우지 말 것.

upstream tikkle_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── 요청 수 제한 (접속 IP 기준) ─────────────────────────────────
# 이 파일은 conf.d 에서 http 블록 안으로 읽힌다. 다른 설정과 이름이 겹치지
# 않도록 영역 이름에 tikkle_ 을 붙인다.
#
# 결제 수신은 POST 만 센다. 같은 주소의 GET(결제 내역 조회)은 키가 빈 값이라
# 세지 않는다.
map $request_method $tikkle_payment_ingest_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone  $binary_remote_addr        zone=tikkle_sms:10m     rate=3r/m;
limit_req_zone  $binary_remote_addr        zone=tikkle_auth:10m    rate=10r/m;
limit_req_zone  $tikkle_payment_ingest_key zone=tikkle_payment:10m rate=30r/m;
limit_conn_zone $binary_remote_addr        zone=tikkle_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.tikkle.xyz;

    # 요청 본문 상한. 앱에는 파일 업로드 API가 없어 1m 이면 충분하다.
    # 결제 수신(POST /api/payments)은 아래 전용 location 에서 더 좁힌다.
    client_max_body_size 1m;

    # 요청 수·동시 연결 제한에 걸리면 429 로 답한다.
    # 동시 연결은 IP 당 20개까지다(SSE 연결 포함).
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn tikkle_conn 20;

    access_log /var/log/nginx/tikkle.access.log;
    error_log  /var/log/nginx/tikkle.error.log;

    # ── SSE 전용: 버퍼링 없이 즉시 흘려보낸다 ──────────────────────
    location ~ ^/api/payments/[0-9]+/stream/?$ {
        proxy_pass http://tikkle_app;
        proxy_http_version 1.1;

        # SSE 는 keep-alive 로 열어둔 채 흘린다. Connection 헤더를 비워
        # upstream 의 keepalive 를 그대로 쓴다.
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        # 2차 인증(카카오톡/네이버/하나) 때문에 사용자가 앱을 떠나 있는
        # 동안에도 스트림이 살아 있어야 한다. 기본 60s 로는 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 결제 수신 ──────────────────────────────────────────────
    # 정상 요청 본문은 1KB 에 못 미친다. 앱도 8KB 를 넘는 본문은 읽지 않고 413 으로 거절한다.
    # 같은 주소의 GET(결제 내역 조회)도 이 location 을 탄다.
    location = /api/payments {
        client_max_body_size 16k;
        limit_req zone=tikkle_payment burst=20 nodelay;

        proxy_pass http://tikkle_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SMS 발송·확인 (회원가입, 비밀번호 재설정) ──────────────────
    location ~ ^/api/auth/(sms|password/reset-sms)/ {
        limit_req zone=tikkle_sms burst=5 nodelay;

        proxy_pass http://tikkle_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 로그인·가입·비밀번호 재설정 ────────────────────────────────
    # 토큰 재발급(/api/auth/reissue)은 앱이 자동으로 부르므로 제한하지 않는다.
    location ~ ^/api/auth/(login|signup|password/reset)$ {
        limit_req zone=tikkle_auth burst=10 nodelay;

        proxy_pass http://tikkle_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 일반 API ────────────────────────────────────────────────
    location / {
        proxy_pass http://tikkle_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
