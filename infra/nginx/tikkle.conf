# api.tikkle.xyz 리버스 프록시
#
# 앱 컨테이너는 127.0.0.1:8080 에만 바인딩되어 외부에서 직접 닿지 않는다.
# TLS 종단은 이 Nginx 가 담당한다 (certbot --nginx 가 443 블록을 자동 추가).
#
# ⚠️ SSE 주의: 결제 파이프라인의 진행 상황은
#    GET /api/payments/{eventId}/stream 이 SSE 로 흘려보낸다.
#    프록시 버퍼링이 켜져 있으면 이벤트가 버퍼에 갇혀 앱이 결과를 못 받는다.
#    아래 stream 전용 location 의 proxy_buffering off 를 절대 지우지 말 것.

upstream tikkle_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tikkle.xyz;

    # 앱 설정(multipart max-request-size: 100MB)과 맞춘다.
    client_max_body_size 100M;

    access_log /var/log/nginx/tikkle.access.log;
    error_log  /var/log/nginx/tikkle.error.log;

    # ── SSE 전용: 버퍼링 없이 즉시 흘려보낸다 ──────────────────────
    location ~ ^/api/payments/[0-9]+/stream/?$ {
        proxy_pass http://tikkle_app;
        proxy_http_version 1.1;

        # SSE 는 keep-alive 로 열어둔 채 흘린다. Connection 헤더를 비워
        # upstream 의 keepalive 를 그대로 쓴다.
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        # 2차 인증(카카오톡/네이버/하나) 때문에 사용자가 앱을 떠나 있는
        # 동안에도 스트림이 살아 있어야 한다. 기본 60s 로는 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 일반 API ────────────────────────────────────────────────
    location / {
        proxy_pass http://tikkle_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
