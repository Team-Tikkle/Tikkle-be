plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tikkle'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // Spring AI
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
    }
}

dependencies {
    // Web 서버, JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // DB 스키마 마이그레이션(src/main/resources/db/migration). Hibernate는 스키마를 대조만 한다
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 헬스체크(관리 포트). 배포 스크립트와 컨테이너 헬스체크가 본다
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // JWT (jjwt) for App Auth
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // JWT (auth0) for Upbit API Auth
    implementation 'com.auth0:java-jwt:4.4.0'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Spring AI for Google Gemini
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'

    // Spring AI for OpenAI (DeepSeek)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // WebClient (Spring AI 스트리밍 용도)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // RSS 파싱 (Google News RSS 수집)
    implementation 'com.rometools:rome:2.1.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MySQL 데이터베이스 드라이버
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Swagger (springdoc-openapi)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    // CoolSMS (Nurigo SDK)
    implementation 'net.nurigo:sdk:4.3.0'

    // Firebase Admin (FCM 푸시 발송)
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // 테스트 도구
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // 테스트용 MySQL·Redis 컨테이너
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'

    // 업비트 API 대역 서버 (실행 클래스패스의 okhttp 와 같은 버전)
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 운영은 메인 클래스에서 시간대를 KST 로 고정한다. 테스트는 메인 클래스를 거치지 않으므로 여기서 맞춘다.
    systemProperty 'user.timezone', 'Asia/Seoul'
}

jar {
    enabled = false
}